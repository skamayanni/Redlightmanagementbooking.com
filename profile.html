<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celebrity Profile</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


    <header class="site-header">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <span>THE</span>
                EXPERIENCE
            </a>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="#about" class="nav-celebrity-about">
                    About
                </a>

                <a href="packages.html" class="nav-celebrity-packages">
                    Packages
                </a>

                <a href="donate.html" class="nav-celebrity-support">
                    Donate
                </a>

                <a href="#" id="contactTawk">
                    Contact
                </a>


                <a href="booking.html#bookingForm" id="profileBooking" class="nav-button">
                    Request a Meet & Greet
                </a>

            </nav>


            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

    </header>


    <main>


        <!-- HERO -->

        <section class="profile-hero">

            <div class="container">

                <div class="profile-hero-content">

                    <div class="profile-image">

                        <img id="profileImage" src="" alt="">

                    </div>

                    <div>

                        <span class="eyebrow" id="profileCategory">
                        </span>

                        <h1 id="profileName">
                        </h1>

                        <p id="profileShortBio">
                        </p>

                        <div class="profile-actions">

                           <a href="packages.html#packagesContainer"  class="explore-button">
                                EXPLORE EXPERIENCES
                            </a>
                            

                            <a href="donate.html#donationlayout" class="explore-button" >
                                MAKE DONATION
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <br>


        <!-- ABOUT -->

        <section class="profile-about" id="about">

            <div class="container">

                <div class="section-heading">

                    <span class="eyebrow">
                        ABOUT
                    </span>

                    <h2 id="aboutName">
                    </h2>

                </div>

                <div class="profile-about-content">

                    <p id="profileBio">
                    </p>

                </div>

            </div>

        </section>


    </main>


    <footer>

        <div class="footer-main">

            <div>

                <a href="index.html" class="logo">
                    <span>THE</span>
                    EXPERIENCE
                </a>

                <p>
                    Creating memorable fan experiences,
                    one moment at a time.
                </p>

            </div>

        </div>


        <div class="footer-bottom">

            <span>
                © 2026 THE EXPERIENCE. All rights reserved.
            </span>

            <span>
                Private fan experiences
            </span>

        </div>

    </footer>

    <script src="js/celebrities.js"></script>
    <script src="js/script.js"></script>
